name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: make sync
      - run: make browsers PLAYWRIGHT_ARGS=--with-deps
      - run: make check
      - name: Verify checked-in browser assets
        run: git diff --exit-code -- src/shiny_charts/www
      - run: make check-wheel

  floor:
    name: Minimum Shiny and htmltools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.10"
      - run: uv run python scripts/check_floor.py --python 3.10 --install-browser

  browsers:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run playwright install --with-deps ${{ matrix.browser }}
      - run: uv run pytest -q tests/test_browser.py tests/test_adoption.py tests/test_portfolio.py
        env:
          SHINY_CHARTS_BROWSER: ${{ matrix.browser }}

  all-checks-passed:
    name: All checks passed
    needs: [python, floor, browsers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check
        if: needs.python.result != 'success' || needs.floor.result != 'success' || needs.browsers.result != 'success'
        run: exit 1
